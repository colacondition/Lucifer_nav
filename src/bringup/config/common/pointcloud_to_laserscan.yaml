# min_height/max_height 是 pointcloud_to_laserscan 在 target_frame（base_link =
# 雷达/云台位姿）下的 z 边界，不是地面高度。这里的值是兜底；real/sim launch 会再加载
# reality|simulation/pointcloud_to_laserscan.yaml 覆盖成"地面以上"的值。
# 只加载本文件会把 20cm 高台（实车 z≈-0.29、仿真 z≈+0.025）整片滤掉。
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_link"
    transform_tolerance: 0.05
    min_height: 0.05
    max_height: 1.2
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0043
    scan_time: 0.3333
    range_min: 0.45
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10
