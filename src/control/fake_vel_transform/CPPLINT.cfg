# clang-format 和 cpplint 对 include 顺序的要求是**相反**的，两者不可能同时满足：
#   cpplint 的 build/include_order 要求 C 系统头(.h) -> C++ 系统头(<memory> 等) -> 其他头
#   ament 的 clang-format 把 .h 归一类、其余 <> 头归另一类并在类内字母序排，
#   于是 <geometry_msgs/...> 会排到 <memory> 前面 —— 正是 cpplint 禁止的。
# 本包两个 linter 都开着，必须选一个当权威。选 clang-format：它是格式化器本尊，
# 而且能 --reformat 自动收敛。所以只屏蔽 cpplint 的 include_order 这一条，
# 其余规则（include_what_you_use、runtime/string、legal/copyright…）照旧生效。
filter=-build/include_order
