# 开发兜底（非运行期权威）：bringup 使用 config/common/small_glim_*.yaml + 环境覆盖。
/**:
  ros__parameters:
    mapping:
      # Output
      save_raw_mapping_frames: false # per-keyframe frame_N.pcd + poses.txt (debug only)
      output_root: "~/mapping"
      # When output_dir is non-empty it overrides output_root (no timestamped subdir);
      # the final map is written to <output_dir>/<map_name>. Wired from launch (map_save_dir / <world>.pcd).
      output_dir: ""
      map_name: ""

      # Point range filter (imu_link frame). Set <= 0 to disable.
      cloud_range_min: 0.8 # Points out of this range will be filtered out (imu_link frame)
      cloud_range_max: 20.0 # Points out of this range will be filtered out (imu_link frame)

      # IMU refine optimization
      # refine IMU-rate trajectory using optimized odometry endpoints, then re-deskew keyframes using the refined trajectory
      enable_imu_refine: true
      imu_refine_max_iterations: 5

      # Keyframe selection (relative to last keyframe)
      keyframe_trans_thresh: 0.1 # meters
      keyframe_rot_thresh: 5.0 # degrees

      # Incremental map integration
      downsample_every_n_keyframes: 1000
      map_voxel_leaf_size: 0.05