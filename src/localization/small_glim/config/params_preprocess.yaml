# 开发兜底（非运行期权威）：bringup 使用 config/common/small_glim_*.yaml + 环境覆盖。
/**:
  ros__parameters:
    preprocess:
      distance_near_thresh: 0.3 # Points out of this range will be filtered out (lidar frame)
      distance_far_thresh: 30.0 # Points out of this range will be filtered out (lidar frame)
      use_random_grid_downsampling: false # If false, use the conventional voxelgrid downsampling
      downsample_resolution: 0.05 # Voxel grid resolution for downsampling
      localization_downsample_resolution: 0.05 # Voxel for authoritative /small_glim/deskewed_cloud (<=0 disables it)
      random_downsample_target: 10000 # Target number of points for voxel-based random sampling (Enabled when > 0)
      random_downsample_rate: 0.1 # Sampling rate for voxel-based random sampling (Enabled when target <= 0)
      enable_outlier_removal: false # If true, enable statistical outlier removal
      outlier_removal_k: 10 # Number of neighbors for outlier removal
      outlier_std_mul_factor: 1.0 # Standard deviation multiplier for outlier removal
      enable_cropbox_filter: false # If true, filter points out points within box
      k_correspondences: 10 # Number of neighbors for covariance estimation
      num_threads: 2 # 8-core budget (LIO 2); bringup overlays must not raise this
      min_points_after_filter: 100 # Drop frame if preprocessing leaves fewer points than this
