# 仿真 URDF 外参：base_link -> livox_frame。语义与实车那份完全一致，见
# config/reality/measurement_params_real.yaml 的说明。
#
# 这里的 z 是仿真里雷达离地高度的唯一来源：代价地图的高度带相对 base_link 取差值，
# 地面分割的 sensor_height 由节点从这条 TF 查出来。改雷达位置只改这一行。
# 实测 PCD/RMUL.pcd 的地面主峰在 -0.17，正好等于 -0.175，可以反过来校验这个值。
base_link2livox_frame:
  xyz: "\"0.12 0.0 0.175\""
  rpy: "\"0.0  0.0  0.0\""
