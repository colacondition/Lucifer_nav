image: RMUC.pgm
mode: trinary
resolution: 0.05
origin: [-2.48, -8.65, 0]
negate: 0
occupied_thresh: 0.65
# 必须 <= 0.196。rm_map_server 用 occupancy = 1 - pixel/255，GIMP/nav2 惯例的
# “未知”灰度 205 算出来正好是 0.196；若 free_thresh 取 0.25，这 2.6 万个未知格
# 会被判成空闲，全局规划器就会以正常代价穿过从未扫到的区域（本该吃
# unknown_cost=1.4 的惩罚）。0.196 是 nav2 的默认值，正是为此。
free_thresh: 0.196
map_start_pose: [0.00, 0.00, 0]
