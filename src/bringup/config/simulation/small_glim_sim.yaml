/**:
  ros__parameters:
    # 仿真覆盖项；Gazebo 的 livox 插件同样发布 /livox/lidar/pointcloud（仅 xyz+rgb、无时间戳，
    # small_glim 自动生成伪时间戳）和 /livox/imu（gazebo_ros_imu_sensor）
    node:
      acc_scale: 1.0           # 仿真 IMU 输出 m/s²（含重力），无需缩放
    sensors:
      # URDF：imu_link 在 base+[0.12,0,0.125]，livox 在 base+[0.12,0,0.175] ⇒ IMU 在雷达系下方 0.05m
      T_lidar_imu: [0.0, 0.0, -0.05, 0.0, 0.0, 0.0, 1.0]
    preprocess:
      num_threads: 2           # 8-core budget: LIO 2; do not overlay 4
      # 0.05 -> 0.1：每帧点数约减半，单帧 GICP 耗时波动更小（开阔场地特征稀疏时
      # 耗时起伏是 odom 节律不均、看着顿挫的主因）。实车保留 0.05。
      downsample_resolution: 0.1
      # 必须与 downsample_resolution 相同（仿真）：common 里定位分辨率是 0.05，
      # 与仿真的 0.1 不等时会走 preprocess_for_localization() 另算一张稠密帧，
      # 而 pub_localization_cloud() 要用「本帧 IMU 轨迹」给它逐点 deskew，校验
      # imu_times.back() >= dense->scan_end_time。仿真点云没有逐点时间戳
      # （time_keeper 按点序生成伪时间），两张云的点集不同 → 稠密帧的
      # scan_end_time 常超出轨迹末尾 → 校验失败、整帧丢弃：
      #   [small_glim] Skip dense localization cloud: invalid/incomplete IMU trajectory
      # 实测 /small_glim/deskewed_cloud 只有 1~6Hz（应 10Hz）且忽快忽慢，连带
      # lidar_filter → /segmentation/obstacle、pointcloud_to_laserscan → /scan、
      # 代价地图障碍源全部跟着抖。分辨率对齐后走零拷贝复用分支
      # （use_odometry_cloud），稠密云稳定 10Hz。实车有真实逐点时间戳，保持 0.05。
      localization_downsample_resolution: 0.1
    odometry_estimation:
      num_threads: 2           # 8-core budget: LIO 2
      # 3.0 -> 1.5：后台 ISAM2 修正滞后减半，odom 的 IMU 预测参考状态更"新鲜"。
      smoother_lag: 1.5
      # 0.1 -> 0.05：target 体素图点更少，配准更快。
      target_downsampling_rate: 0.05
    mapping:
      map_voxel_leaf_size: 0.05
