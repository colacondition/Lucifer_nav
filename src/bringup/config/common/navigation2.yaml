# 到达判定半径（m）：接近段已并进 rm_mpc_controller，这是唯一到点半径。
# rm_mpc_controller 的 recovery.suppress_near_goal 必须 >= 它
# （当前 0.35 是刻意更宽的失效检测抑制带，不参与共享）。
goal_tolerance_default: &goal_tolerance_default 0.25

rm_map_server:
  ros__parameters:
    use_sim_time: true
    map_filename: ""
    frame_id: map
    map_topic: /map
    semantic_map_topic: /map_server/semantic_map
    publish_frequency: 1.0
    # 离线膨胀。参数是物理距离，换分辨率不用重调。
    # 这一层不是给 A* 用的（它有自己的 clearance 距离场），是给 MINCO / MPC 当
    # 梯度源：代价在障碍格内跳到 255、格外是 0，梯度既不连续又在一格外恒为零，
    # 优化器根本看不见远处的约束。
    inflation:
      full_cost_radius_m: 0.10
      cutoff_radius_m: 0.30
      decay_rate_per_m: 24.0
      # 膨胀圈方向模长上限，必须 <= 0.9。超过 0.95 会让膨胀圈被误判成隧道本体，
      # 也就是「车还没进洞就以为自己在洞里」。
      direction_non_body_magnitude_cap: 0.9

rm_global_planner:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    map_topic: /global_costmap/costmap
    goal_topic: /goal_pose
    path_topic: /plan_raw
    # 8Hz：实测整机 24 核 busy<8%，A* 单次 <5ms —— 用空闲核把「状态变了到
    # 路径更新」的等待从最坏 200ms 压到 125ms。失败冷却不受影响。
    planning_frequency: 8.0
    allow_unknown: true
    unknown_cost: 1.4
    obstacle_threshold: 100
    # A* 格代价映射：cellCost = 1 + map_cost_weight * (格值/100)^map_cost_exponent。
    # weight 越大越绕开高代价格（越不贴墙）；exponent <1 抬高低代价、>1 放大高代价。
    map_cost_weight: 20.0
    map_cost_exponent: 2.0
    planner_tolerance: 0.5
    # 净空偏好：离障碍距离 < desired 时加 weight*((desired-dist)/desired)²。
    # 让路径尽量离墙 desired 远。weight 越大越远离墙（但更绕）。
    use_clearance_cost: true
    clearance_desired_distance: 0.4
    clearance_cost_weight: 3.0
    replan_on_timer: true
    replan_on_source_update: false
    min_replan_distance: 0.20
    replan_request_topic: /navigation2/replan_request
    # 转向惩罚：turn_cost = turn_penalty * (1 - cos(转向角))。越大路径越直（少
    # 拐弯、少蛇形），但可能绕更远；越小越贴近几何最短但拐角多。
    # 折线拐角会被 speed_profile 按曲率限速，turn_penalty 太小会让整段路像爬行。
    turn_penalty: 0.30
    # 局部缝合：重规划时在旧路径前方 stitch_min_lookahead_distance 处接新路径，
    # 避免整条路径跳变；缝合段最长 stitch_max_distance。车头路径抖优先看这里。
    local_stitch_enabled: true
    stitch_min_lookahead_distance: 0.8
    stitch_max_distance: 3.0
    path_prune_enabled: false
    prune_segment_max_cost: 55
    path_resample_distance: 0.18
    # 规划失败冷却：规划失败后等待此时长再重试（s）。
    # 防止对不可达目标以 planning_frequency 空转刷日志。
    # 目标明显移动（> planner_tolerance）或收到明确重规划请求时忽略冷却。
    plan_failure_cooldown: 2.0
    # 路径发布前验收：与 A* obstacle_threshold 对齐。更小会把 A* 走过的膨胀格
    # 整条拒绝并进入 plan_failure_cooldown。代码取 max(本值, obstacle_threshold)。
    path_acceptance_enabled: true
    path_acceptance_max_cost: 100
    # 语义地图：隧道格的轴线用来在洞内给「偏离轴线」加代价。收不到这个话题时 A*
    # 退回纯几何行为（隧道被当普通空地），不报错。
    semantic_map_topic: /map_server/semantic_map
    # 洞内偏离轴线的代价权重：每步加 w * (1 - |cos θ|)。洞只比车稍宽，横向余量很小，
    # 斜着走一格就贴壁，所以要把路径压到轴线上。
    #
    # 是软代价而不是硬性禁止斜步：车体是圆柱，朝向不影响能不能过。设 0 关闭。
    tunnel_axis_cost_weight: 2.0

rm_global_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    map_topic: /map
    # 语义地图：隧道本体向外扩 tunnel_margin_m 的影响区内点云一律不标记，膨胀
    # 半径压到通道容得下的值。没收到这个话题时行为退回纯几何，不会报错。
    semantic_map_topic: /map_server/semantic_map
    scan_topic: /scan
    subscribe_scan: false
    pointcloud_topic: /segmentation/obstacle
    subscribe_pointcloud: true
    costmap_topic: /global_costmap/costmap
    raw_costmap_topic: /global_costmap/costmap_raw
    footprint_topic: /global_costmap/published_footprint
    marked_cloud_topic: /global_costmap/voxel_marked_cloud
    voxel_grid_topic: /global_costmap/voxel_grid
    publish_frequency: 8.0
    robot_radius: 0.25
    inflation_radius: 0.65
    inflation_cost_scaling_factor: 3.0
    occupied_threshold: 50
    obstacle_min_range: 0.1
    obstacle_max_range: 3.0
    # 障碍高度带，单位 m，相对机器人底盘（base_link）而不是 map 的 z=0 平面。
    # 为什么不能拿绝对 z 比常数：Super-LIO 的 odom 原点锚在开机瞬间的雷达位姿上
    # （tf_pose_utils.hpp: lidar_odom_to_base = lidar_odom_to_livox * livox_to_base），
    # 所以 map 系的 z=0 是雷达平面，地面在 -(雷达安装高度) 处。实测 RMUL.pcd：
    # 地面主峰在 -0.17（37287 点里 14558 个），正好是 -0.175 的安装高度；
    # 20cm 高台的台面绝对 z 只有 +0.025，被任何 >0.025 的绝对阈值静默滤掉，而
    # 1m 的墙在 +0.825 照常可见 —— 这就是「左边高台看不见、右边墙全看得见」。
    # 做差之后雷达平面偏移和定位 z 漂移都被抵消。参考 rose_navigation 的
    # bottom_z_to_robo_z / top_z_to_robo_z。
    # 取值：底盘≈地面，所以地面≈0.0、台面≈+0.20。0.1 两头各留 0.1 m 余量，
    # 既滤掉地面分割残留（负值会把残留变成虚假障碍把车围死），又保住 20cm 台阶。
    obstacle_z_min_to_robo: 0.1
    obstacle_z_max_to_robo: 2.0
    # 隧道影响区边距：本体格向外扩这么多米。区内点云一律不标记 —— 顶板、门楣在
    # 点云里跟墙没有区别，任何高度阈值都在「滤掉结构」和「漏掉真障碍」之间赌；
    # 净高够不够、姿态收没收归电控，导航只负责把车沿轴线送进洞，能不能进由静态
    # 地图的壁面致命格决定。0 边距时门楣点云（落在本体格外一到两格）会被标成致命
    # 格横在洞口上、洞口格又吃到两侧墙的全量膨胀，洞口整体封死。
    # 语义与 rm_local_costmap 的同名参数一致，两边必须一起改。
    tunnel_margin_m: 0.20
    transform_tolerance: 0.2
    observation_timeout: 2.0  # 与局部代价地图对齐：10Hz 多跳链路实测延迟 ~1-2s，1.0 会导致全局图永远无视实时障碍
    reuse_previous_grid: true
    previous_obstacle_decay: 12

# 平滑器是 MINCO（rm_minco_path_smoother），节点名必须对上，否则整段参数不生效。
# 平滑器做几何平滑 + 数据保持 + 隧道轴向对齐；障碍 soft 代价从进程内距离场注入
# （rm_local_costmap 维护，distance_field_enable 开启后可用），未就绪时静默失效。
rm_minco_path_smoother:
  ros__parameters:
    use_sim_time: true
    input_path_topic: /plan_raw
    output_path_topic: /plan

    # MINCO 优化参数
    smooth_weight: 0.5        # 平滑项权重（0.1 几乎贴着 A* 折线，弯道曲率限速会把车速压到 min_speed）
    data_weight: 10.0         # 数据项权重（保持接近原路径）
    enable_optimization: true  # MINCO L-BFGS 优化

    # 障碍 soft 代价：控制点离障碍 < safe_dist 时加 obstacle_weight*(safe_dist-d)²。
    # 距离场未就绪时静默失效。设 0 关闭。开启后同时启用发布前硬校验（任何采样点
    # < safe_dist 即拒绝该轨迹，回退原始路径）。起始值 2.0 为未实测标定，上车前在
    # 仿真里核对：窄通道不贴对侧墙、动态障碍让行、safety_reject 拒绝率不异常。
    obstacle_weight: 2.0
    safe_dist: 0.2

    # 关断式性能观测：默认关。开 enable 后记录优化耗时 / 成功 / 失败原因。
    performance.enable: false
    performance.csv_enable: false
    performance.csv_path: /tmp/minco_perf.csv
    performance.print_enable: false

    # 固定时间分配参数（时间不进入 L-BFGS，保持现有优化变量和内存规模）。基础段时间
    # = distance/default_velocity；每个拐角再增加 turn_time_weight*|turn_angle| 秒，并按
    # 相邻段长度分摊到两侧。这样急弯在 MINCO 初值中有更大过渡时间，0 可退回历史行为。
    default_velocity: 2.0
    min_segment_time: 0.1
    turn_time_weight: 0.12
    # L-BFGS 预算：旧 history=256、单阶段上限4000在两阶段下内存/最坏耗时过大。
    # 现在 objective 矩阵按路标数预分配并跨 line-search 复用；history=32，第一阶段
    # 上限800、第二阶段300。性能监控可记录实际耗时，必要时再收紧。
    lbfgs.memory_size: 48   # 空闲核换更深的二阶记忆：难弯道收敛更快
    first_stage.max_iterations: 800
    # 受限两阶段 MINCO：第一阶段给几何形状；若固定采样发现速度/加速度违反阈值，
    # 只增加相应段时间并以较小迭代预算重跑。第二阶段障碍soft梯度只保留轨迹法向，
    # 失败则保留第一阶段结果。默认开启；可通过性能监控观察 P95，异常时一键关闭。
    two_stage.enable: true
    two_stage.max_speed: 2.0
    two_stage.max_accel: 4.0
    two_stage.max_scale: 1.5
    two_stage.samples_per_piece: 5
    two_stage.max_iterations: 300
    # 两阶段的 v/a 极值检测：true = 多项式求根（精确，能看见段内尖峰）；
    # false = 旧的每段等距采样（更省，但 5 个样本会低估峰值 10-20%）。
    two_stage.exact_dynamics_check: true

    # 语义地图：隧道格的轴线用来在洞内给「偏离轴线」加软代价。收不到或图里没隧道时
    # 对齐项自动失效，退回纯几何平滑。
    semantic_map_topic: /map_server/semantic_map
    # 隧道内偏离轴线的软代价权重：每段加 w * (1 - |cos θ|)。防止平滑阶段在洞口把对着
    # 洞的走向拧成斜切。软代价而非硬约束（车是圆柱，朝向不影响能不能过）。设 0 关闭。
    tunnel_axis_weight: 5.0
    # 隧道横向走廊软代价：路标点横向偏移超出 clear_width/2 - robot_radius 时加
    # w * 超出量²。轴向项管「走向正不正」，这项管「别贴壁」—— 洞里斜着走一格就
    # 吃掉横向余量，光有轴向项压不住。纵向不设界（路径要从洞两头穿出去）。
    # 出洞后走廊按到洞口的距离线性放宽（喇叭形），L-BFGS 在洞口不会看到代价跳变。
    # 权重 100 由 RMUL 实图扫描得到（tools/sfc_corridor_dump + render_corridor.py）：
    # 同一条穿洞路径，洞内横向偏移 均值/最大 随权重变化为
    #   0 -> 0.196/0.395   20 -> 0.115/0.310   50 -> 0.081/0.256
    #   100 -> 0.067/0.215  200 -> 0.057/0.177  500 -> 0.041/0.130
    # 取 100：居中效果相对 20 明显提升（均值降 42%），量级仍与数据项 10、轴向项 5
    # 同档，且不会把轨迹从前端路径上扯开（走廊项只在隧道影响区内生效）。
    #
    # 注意**软惩罚给不了硬保证**：RMUL 隧道自由格宽 0.65 m、车体半径 0.25 m，
    # 车心必须保持在轴线 ±0.075 m 内才不擦壁，而权重扫到 500 最大偏移仍有 0.13 m。
    # 硬保证来自 global_check 的 SFC 校验 + repair 修复循环，不是这一项。
    # 设 0 关闭。
    tunnel_corridor_weight: 100.0
    # 走廊查询用的隧道影响区边距，与 rm_global_costmap / rm_local_costmap 的
    # tunnel_margin_m 同一取值，三处必须一起改。
    tunnel_corridor.margin_m: 0.20
    # 横向半宽 = max(0, clear_width/2 - robot_radius) + 本值。
    # RMUL 两条隧道的 clear_width 都是 0.5 m，而代价地图 robot_radius 是 0.25 m，
    # 相减恰好为 0 —— 车体直径等于净宽，物理余量为零。此时半宽 0 的含义是
    # 「把车压在轴线上」，不是「没有约束」；调大本值会放宽成一条有宽度的走廊，
    # 只有在实车量出的车体半径明显小于 0.25 m 时才需要。
    tunnel_corridor.lateral_margin_m: 0.0

    # —— 全图级安全校验（借鉴 TDT-nav-kit 的 SFC 走廊）——
    # 现有发布前校验只覆盖 rm_local_costmap 的 5x5 m 滚动窗口，5 m 以外的全局障碍
    # 对它不可见。这里从全局代价地图建「以采样点为中心的最大无致命格方形」，
    # 半宽 < robot_radius 即拒绝。收不到全局代价地图时该项自动跳过（无法判定
    # 不等于判为不可行），不报错。
    global_check.enable: true
    global_check.costmap_topic: /global_costmap/costmap
    # 与 rm_global_costmap / rm_local_costmap 的 robot_radius 同源。
    global_check.robot_radius: 0.25
    # 单个走廊的最大半宽。只影响查询效率上界，不影响判定结果。
    global_check.max_range: 2.5
    # 必须与 rm_global_planner 的 obstacle_threshold 一致：不一致会把 A* 走过的
    # 膨胀格判成不可行，整条轨迹被无条件拒绝。
    global_check.obstacle_threshold: 100
    # 与 rm_global_planner 的 allow_unknown 互补：allow_unknown=true 时这里必须 false。
    global_check.unknown_is_lethal: false
    # —— 有界迭代修复（借鉴 TDT-nav-kit 的碰撞迭代）——
    # 校验失败不再立刻整条拒绝回退折线，而是先修复再重优化，预算用尽才回退。
    # 第 1 次修复放大 data_weight（弱约束：压住偏离前端路径的自由度），第 2 次
    # 在最偏离处插入路标点（强约束：给 L-BFGS 新自由度），交替。0 = 关闭，
    # 回到历史行为。修复会叠加优化耗时，性能监控的 P95 是是否保留的判据。
    repair.max_attempts: 2
    # 插点修复的最小偏离阈值（m）：最差采样点离前端路径折线小于此值时不再插点，
    # 避免在偏离可忽略的位置白白增加路标数。
    repair.waypoint_spacing: 0.15

rm_local_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    scan_topic: /scan
    pointcloud_topic: /segmentation/obstacle
    # 语义地图：隧道本体向外扩 tunnel_margin_m 的影响区内点云一律不标记，膨胀
    # 半径压到通道容得下的值。没收到这个话题时行为退回纯几何，不会报错。
    semantic_map_topic: /map_server/semantic_map
    costmap_topic: /local_costmap/costmap
    raw_costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    marked_cloud_topic: /local_costmap/voxel_marked_cloud
    subscribe_scan: false
    subscribe_pointcloud: true
    update_frequency: 10.0
    publish_frequency: 10.0
    width: 5.0
    height: 5.0
    resolution: 0.05
    robot_radius: 0.25
    inflation_radius: 0.35
    inflation_cost_scaling_factor: 15.0
    raytrace_max_range: 6.0
    obstacle_min_range: 0.1
    obstacle_max_range: 6.0
    # map 系下判定（local_costmap_node.cpp:664，在 transformPoint 之后）。
    # 局部图管避障，取比全局图更小的 0.05 少漏矮障碍。必须为正：负值会把地面
    # 同 rm_global_costmap：相对底盘的高度带，语义见上面那段。局部图管避障，
    # 下界取更小的 0.05 以少漏矮障碍，但必须为正 —— 负值会把地面分割的残留点
    # 变成虚假障碍把车围死。
    # 20cm 高台看不见还有第二个必要条件：segmentation 的 max_start_height 必须
    # 小于最矮台阶高度，见 config/{simulation,reality}/segmentation_*.yaml。
    obstacle_z_min_to_robo: 0.05
    obstacle_z_max_to_robo: 2.0
    # 隧道影响区边距，语义见 rm_global_costmap 里的同名参数。两边必须一致：
    # 只在一边放行会让全局规划出的路在局部层被判为撞墙。
    tunnel_margin_m: 0.20
    transform_tolerance: 0.2
    observation_timeout: 2.0
    snap_origin_to_grid: true
    use_observation_stamp_for_origin: true
    publish_on_observation_update: false
    use_latest_sensor_transform: false
    fallback_to_latest_sensor_transform: false
    update_on_new_observation_only: true
    reuse_previous_grid: true
    previous_obstacle_decay: 8
    # 命中增量：点云/扫描命中格时代价累加 hit_inc（而非直接置 100）。100=单帧致命
    # （历史行为）；调小（如 50）需多帧确认才到 obstacle_threshold，抑制瞬时噪声。
    hit_inc: 100
    # 动态残影时间衰减（sentry 的 keep_time→clear_time 语义）：命中后 age<keep_time
    # 保持致命、keep_time≤age<clear_time 线性衰减、age≥clear_time 清除。
    # enable=true 时替代 previous_obstacle_decay 的固定整数衰减；false 退回整数衰减。
    dynamic_decay.enable: true
    dynamic_decay.keep_time: 0.8
    dynamic_decay.clear_time: 1.2
    # 保守先验合并（sentry「先验 occupied 强制并入、先验 free 不抹在线障碍」）：
    # 语义地图 OBSTACLE 格强制标进局部图，先验只加不减。收不到语义地图时静默失效。
    prior_merge.enable: true
    # 进程内距离场（Signed ESDF：障碍外正、障碍内负），给 MINCO 障碍 soft 代价与
    # MPC 倒车脱困方向（+grad）共用。HAZARD 安全点仍是 occupancy 环采样 + 射线，
    # 不另起地图节点、不拷 OccupancyGrid。开启后每次发布多两次 O(n) 距离变换
    # （5m×5m@0.05 约 1 万格，仍 <2ms）。未开启时 MINCO 障碍项与梯度倒车静默失效。
    distance_field_enable: true

# 速度平滑器：最后一道限幅（夹速度、死区、输入超时归零），与 MPC 同频。
# 加减速斜坡在 MPC speed_profile，这里不再改写时间剖面。
rm_velocity_smoother:
  ros__parameters:
    use_sim_time: true
    input_cmd_vel_topic: /cmd_vel_nav
    output_cmd_vel_topic: /cmd_vel
    smoothing_frequency: 30.0   # 与 MPC control_fps 对齐；定时器只做超时归零
    velocity_timeout: 0.5       # 输入超时（s）：超过此时长无输入即归零停车
    max_velocity: [2.0, 2.0, 3.0]     # 速度上限 [x, y, yaw]（m/s, rad/s）
    min_velocity: [-2.0, -2.0, -3.0]  # 速度下限（负值 = 允许倒车/反向转）
    max_accel: [4.0, 4.0, 6.0]        # 仍声明以免旧配置报未声明；当前不做斜坡
    max_decel: [-4.0, -4.0, -6.0]
    deadband_velocity: [0.0, 0.0, 0.0]  # 死区：绝对值小于此值强制归零（抑制微抖）

rm_nav2_compat:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    action_name: /navigate_to_pose
    goal_topic: /goal_pose
    status_topic: /navigation2/status
    feedback_frequency: 10.0
    action_timeout: 0.0

rm_mpc_controller:
  ros__parameters:
    use_sim_time: true
    target_frame: map
    path_topic: /plan
    odom_topic: /Odometry
    cmd_vel_topic: /cmd_vel_nav
    control_fps: 30.0
    expected_speed: 2.0
    goal_tolerance: *goal_tolerance_default
    # 接近段（原独立节点）。恢复期和 follow 中间点仍走 /goal_approach_controller/enabled。
    approach.enable: true
    approach.distance: 1.0
    approach.velocity: 1.0
    approach.direct_distance: 0.5
    approach.direct_kp: 1.0
    # 跟踪残差超过此值判为「跟丢」（触发 tracker 丢失 / 恢复链）。调大=更容忍
    # 路径偏差（不易报丢但可能偏离路线），调小=更严格（频繁报丢）。
    max_track_error: 0.5
    # 终点盲区（m）：路径终点附近此半径内跳过参考点（避免终点数值抖动）。
    blind_radius: 0.1
    # 无参考航向时的默认角速度（rad/s）。一般保持 0。
    default_wz: 0.0
    # Prediction horizon (MPC): steps * predict_dt seconds ahead.
    predict_steps: 30
    predict_dt: 0.1
    max_speed: 2.0
    max_accel: 4.0
    turtle_max_speed: 1.0
    # QP 权重：Q=位置跟踪、R=控制量大小、Rd=控制平滑度。
    #   轨迹贴不贴        → 调 Q（大=贴得紧，但易震荡/超调）
    #   速度敢不敢给      → 调 R（大=越省力越保守，速度上不去）
    #   速度/角速度抖不抖 → 调 Rd（大=越平滑，但响应滞后）
    Q: [15.0, 15.0]
    # 路径坐标系位置权重：保持 XY 虚拟云台模型不变，只把位置误差按轨迹切向/法向
    # 分解。法向权重大于切向时，优先压低会导致窄通道擦壁的横向误差；QP稀疏结构在
    # configure时一次建立，每拍只原位更新P数值，不重建OSQP workspace。
    tracking_frame_weights.enable: true
    tracking_frame_weights.tangential: 6.0
    tracking_frame_weights.lateral: 24.0
    tracking_frame_weights.min_tangent_speed: 0.05
    R: [0.1, 0.1]
    # 原先 Rd=[1.0, 0.05] 世界系 x 比 y 平滑一个数量级，沿场地 x 方向加速明显发闷。
    Rd: [0.15, 0.15]
    # 速度上界语义。false = 逐分量 box |ux|,|uy| <= max_speed，对角方向实际
    # 能跑到 sqrt(2)*max_speed（声明 2.0 的机器人斜 45° 会下发 2.83 —— 电控的
    # 功率控制大概率把它削掉，MPC 的预测与实际不符，表现为跟踪误差）。
    # true = 内接正八边形，||u||_2 <= max_speed 处处成立，轴向保留 92.4%
    # （2.0 -> 1.85 m/s）。见 mpc_solver.hpp 头注释的推导。
    #
    # 默认 true：max_speed 声明的是「速度上限」，让实际值超出声明 41% 是缺陷
    # 而不是特性。若团队当初就是按「每轴上限」在调参、想保留对角速度，
    # 改回 false，或把 max_speed 提到 2.16（2.0/cos22.5°）再保持 true。
    speed_norm.enforce: true
    # Odometry delay compensation (off by default; extrapolates pose over odom->now latency).
    delay_compensation.enable: false
    delay_compensation.max_dt: 0.5
    # 关断式性能观测：默认关。开 enable 后记录控制周期耗时 / MPC solve 失败原因。
    performance.enable: false
    performance.csv_enable: false
    performance.csv_path: /tmp/mpc_perf.csv
    performance.print_enable: false
    local_safety.costmap_topic: /local_costmap/costmap
    local_safety.obstacle_threshold: 90
    local_safety.unknown_is_obstacle: true
    local_safety.costmap_timeout: 0.5
    # 「多久没收到新图」判链路活性（steady clock，与 header.stamp 无关）。
    # 局部图 header.stamp 是观测（点云）时间戳，10Hz 分割链端到端延迟实测
    # 1~2s，数据时效改由下面 max_observation_age_sec 单独约束——两者分开
    # 后，正常延迟不再被误判成「图旧」而拖进恢复链。
    local_safety.max_observation_age_sec: 2.0
    # 检查预测序列的前 check_steps 个端点（点数而非秒数）：端点间距 =
    # predict_dt × 名义速度。改 predict_dt 时这条注释不再隐含换算耦合。
    #
    # 11 而不是 10：与 speed_norm.enforce 的耦合。安全判据关心的是**距离**
    # （撞上之前发现障碍），而 check_steps 是**时间**窗。八边形把最大速度从
    # 2.0 压到 1.85 m/s（0.924 倍），同样的 1.0 s 只看前 1.85 m 而非 2.0 m ——
    # 提前量少 7%。补到 11 步把距离拉回 ~2.03 m，保持原有安全提前量。
    # 改 speed_norm.enforce 或 max_speed 时必须同步复核这个值。
    local_safety.check_steps: 11
    local_safety.replan_topic: /navigation2/replan_request
    local_safety.replan_cooldown: 0.5
    # 大横向偏差的软重规划阈值（m）：比硬 noProgress 阈值更早触发请求，
    # 只影响请求节拍（仍受 replan_cooldown 限流），不进恢复链。
    local_safety.soft_replan_track_error: 0.35
    # 隧道限速窗口。洞内的参考速度按 TunnelSpec 的 [velocity_min, velocity_max] 夹：
    # 洞里净空低、余量小，全速冲进去既危险、参考又不可跟踪。窗口在速度剖面的曲率限速
    # 之后、前/后向扫描之前施加，所以「洞口减到 vmax」会沿弧长向洞外铺成一段减速斜坡，
    # 车在进洞前就减到位，而不是洞口瞬间跳变（跳变的参考 MPC 跟不上）。
    # 收不到语义地图或图里没隧道时静默失效。设 enable=false 关闭。
    tunnel_speed_window.enable: true
    semantic_map_topic: /map_server/semantic_map
    # 弧长域速度剖面。替代全程恒定的 expected_speed，在弯道自动减速，
    # 避免 MPC 参考轨迹本身就不可跟踪（过弯不减速 → 参考跑到弯道外 → 切角）。
    # 关掉 speed_profile.enable 可退回原先的常数速度行为。
    speed_profile.enable: true
    speed_profile.max_lateral_accel: 4.0    # 侧向加速度上限（m/s²），主要调参项
    speed_profile.max_tangential_accel: 2.5 # 切向加速度上限（m/s²）
    speed_profile.max_tangential_decel: 3.0 # 切向减速度上限（m/s²）
    speed_profile.min_speed: 0.3            # 速度下限（m/s），防止极小圆弧处停车
    speed_profile.sample_spacing: 0.10      # 剖面采样间距（m）
    speed_profile.curvature_window: 3       # 曲率平滑窗（样本数，双侧）
    speed_profile.stop_at_goal: true        # 终点是否减速至零
    # 卡住检测喂本节点上一拍下发的速率，不再反读 /cmd_vel。平滑器只限幅，
    # 下游改写不再是热路径上的第二套控制。
    # 云台收放。rm_tunnel_posture 在进洞前把 posture_topic 置真，serial_driver 把电控
    # 回传的实测姿态发到 posture_state_topic。请求「收下来」而实测还没变成「低」时，本
    # 节点停车等 —— 云台立着进洞会撞在顶板上，停着等的代价只是不动。
    gimbal.posture_topic: /gimbal_posture
    gimbal.posture_state_topic: /gimbal_posture_state
    # 定位完整性门。只订 fast_location 的 localization_status：LOST 停车等重定位，
    # 不进恢复链（倒车同样按坏 map 位姿算）。OK（含握住 TF / 走廊投影）不停。
    # 没收到过消息时不拦 —— mapping_nav 不起 fast_location，缺省停车会把建图导航停死。
    integrity_gate.enable: true
    integrity_gate.topic: /localization_status
    # 多假设弧长进度跟踪。替代原来的全路径最近点扫描：回绕路径上最近点会在
    # 两个弧长相差很远、空间距离接近的位置间跳变，且进度可回退。
    # 跟踪丢失沿用上面的 max_track_error，只是改为需要持续超限 lost_grace_time。
    tracker.hypothesis_spacing: 1.0      # 初始假设沿路径的播撒间距（m）
    tracker.search_window: 1.5           # 每帧在预测弧长附近的精修半径（m）
    tracker.refine_step: 0.05            # 精修时的粗扫步长（m）
    tracker.max_hypotheses: 5            # 保留的假设上限
    tracker.position_sigma: 0.35         # 位置残差的似然尺度（m），实车主要调这个
    tracker.direction_weight: 1.5        # 方向一致性权重，0 表示完全不看方向
    tracker.min_speed_for_direction: 0.15  # 低于此速率时方向项取中性（m/s）
    tracker.weight_floor: 0.02           # 归一化权重低于此值的假设被淘汰
    tracker.merge_distance: 0.25         # 弧长相距小于此值的假设合并（m）
    tracker.seed_prior_length: 3.0       # 播撒时偏向小弧长的先验尺度（m）
    tracker.arc_rate_alpha: 0.3          # s_dot 的 EMA 系数
    tracker.velocity_alpha: 0.4          # 内部速度估计的 EMA 系数
    tracker.lost_grace_time: 0.5         # 残差持续超限多久才判丢失（s）
    # 失效检测。判据基于世界系位移而非弧长里程碑：全局规划器每移动
    # min_replan_distance(0.2 m) 就重规划一次、弧长原点随之重置，基于弧长的
    # 计时器永远累计不到超时阈值。
    # noProgress 不看指令（捕捉「MPC 一直在自己停车」的循环）；
    # stuck 要求正在下发指令（捕捉「发着速度车没动」——顶障碍、打滑）。
    progress.min_displacement: 0.15      # 认为「确实动了」所需的最小位移（m）
    progress.no_progress_timeout: 2.0    # 位移不增长多久算无进展（s）
    progress.stuck_timeout: 1.5          # 有指令但位移不增长多久算卡住（s）
    progress.cmd_epsilon: 0.05           # 速率超过此值才算「正在下发指令」（m/s）
    # 恢复链。车贴到障碍上后规划器的起点检查过不了，直接重规划几乎必然失败，
    # 会陷入「停车 -> 请求重规划 -> 起点不可行 -> 继续停车」死循环。
    # 因此先物理脱困（倒退，或采样安全点驶入）再强制重规划。
    # 关掉 recovery.enable 即退回原行为，失效检测的日志仍保留。
    recovery.enable: true
    recovery.reverse_speed: 0.3          # STUCK_REVERSE 的倒退速度（m/s）
    recovery.reverse_distance: 0.4       # 倒退距离（m）
    recovery.max_speed: 0.4              # 驶向安全点的限速（m/s）
    recovery.kp: 1.0                     # 驶向安全点的 P 增益
    recovery.reach_tolerance: 0.12       # 到达安全点的判定半径（m）
    recovery.dwell_time: 0.4             # 到点后需持续非危险多久才退出（s）
    recovery.max_duration: 10.0          # 单次恢复的时长上限（s），超时进 FAILED
    recovery.max_attempts: 3             # 恢复尝试次数上限，用尽进 FAILED
    recovery.goal_change_threshold: 0.3  # 路径终点移动超过此值算新目标，清 FAILED（m）
    # 三条「本拍无法正常跟踪」的路径（跟踪丢失 / QP 求解失败 / 预测轨迹被安全
    # 检查否决）连续持续超过此时长，就从「停车+重规划」升级为物理脱困。单帧的
    # 坏代价图或偶发 QP 抖动应由重规划解决，不该惊动恢复链，所以这里留 1.5 s。
    recovery.veto_recovery_time: 1.5
    # 距目标小于此值时关闭失效检测。必须 >= goal_tolerance，否则到点静止会被
    # stuck 误触发。
    recovery.suppress_near_goal: 0.35
    # 恢复期关掉接近段，否则 0.5 m 内的对准会把倒车指令吃掉。话题名保持旧名，
    # 航点执行器仍往这里写。
    recovery.approach_enabled_topic: /goal_approach_controller/enabled
    # 危险判据与恢复期通行判据。通行只看 lethal 是必要的放宽：车已经在膨胀圈
    # 里，用 local_safety.obstacle_threshold(50) 检查会让所有方向立即被否，
    # 恢复永远无法启动。障碍格写 100、膨胀值严格低于 100，故 99 可区分两者。
    recovery.hazard_cost: 80             # 当前格代价达到此值即判为危险
    recovery.lethal_cost: 99             # 达到此值算致命障碍
    recovery.unknown_is_hazard: true     # 未知格（-1）是否算危险
    recovery.out_of_map_is_hazard: true  # 地图外是否算危险
    recovery.ring_radii: [0.3, 0.6, 0.9, 1.2]  # 安全点同心环采样半径（m）
    recovery.samples_per_ring: 12        # 每环的角度采样数
    recovery.distance_penalty: 20.0      # 距离惩罚，同等安全时优先更近的点

rm_tunnel_posture:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    semantic_map_topic: /map_server/semantic_map
    # 规划路径（map 系）。判定「是不是真要穿洞」：路径穿过隧道本体才收云台，贴着
    # 洞口路过（不进洞）不收。收不到路径时只靠 inside 兜底。
    path_topic: /plan
    # 发给电控的收云台请求。true = 车即将进洞或正在洞里，云台必须收下来。
    posture_topic: /gimbal_posture
    # 判定频率。提前量是距离量（TunnelSpec.run_up），不是时间量，所以这里不需要跟
    # 控制环同频；10 Hz 下 1.5 m/s 每帧走 0.15 m，相对 run_up 的余量足够。
    update_frequency: 10.0
    # 抬起云台要比落下多退这么多米才算离开隧道影响范围。
    # 没有滞回时，标志位会在 run_up 边界上随定位噪声抖动，电控那边就是云台反复抬落。
    hysteresis: 0.3

rm_gimbal_visualizer:
  ros__parameters:
    use_sim_time: true
    # 画在车体坐标系里，随车走。与 rm_tunnel_posture 用同一个 frame。
    robot_base_frame: base_link_fake
    # 实态 = 电控持续回传（serial_driver 转发电控，仿真里是 simulated_gimbal）。
    posture_state_topic: /gimbal_posture_state
    # 命令 = rm_tunnel_posture 发的切换请求，和实态并排显示，能看出执行延迟。
    posture_topic: /gimbal_posture
    # RViz MarkerArray 显示块订阅这个话题。
    marker_topic: /gimbal_status
