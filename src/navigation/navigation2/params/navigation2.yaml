rm_map_server:
  ros__parameters:
    use_sim_time: true
    map_filename: ""
    frame_id: map
    map_topic: /map
    semantic_map_topic: /map_server/semantic_map
    publish_frequency: 1.0
    # 离线膨胀。参数是物理距离，换分辨率不用重调。
    # 这一层不是给 A* 用的（它有自己的 clearance 距离场），是给 MINCO / MPC 当
    # 梯度源：代价在障碍格内跳到 255、格外是 0，梯度既不连续又在一格外恒为零，
    # 优化器根本看不见远处的约束。
    inflation:
      full_cost_radius_m: 0.10
      cutoff_radius_m: 0.30
      decay_rate_per_m: 24.0
      # 膨胀圈方向模长上限，必须 <= 0.9。超过 0.95 会让膨胀圈被误判成隧道本体，
      # 也就是「车还没进洞就以为自己在洞里」。
      direction_non_body_magnitude_cap: 0.9

rm_global_planner:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    map_topic: /global_costmap/costmap
    goal_topic: /goal_pose
    path_topic: /plan_raw
    planning_frequency: 5.0
    allow_unknown: true
    unknown_cost: 1.4
    obstacle_threshold: 100
    inflation_radius: 0.9
    inflation_cost_scaling_factor: 3.0
    apply_internal_inflation: false
    # A* 格代价映射：cellCost = 1 + map_cost_weight * (格值/100)^map_cost_exponent。
    # weight 越大越绕开高代价格（越不贴墙）；exponent <1 抬高低代价、>1 放大高代价。
    map_cost_weight: 20.0
    map_cost_exponent: 2.0
    planner_tolerance: 0.5
    # 净空偏好：离障碍距离 < desired 时加 weight*((desired-dist)/desired)²。
    # 让路径尽量离墙 desired 远。weight 越大越远离墙（但更绕）。
    use_clearance_cost: true
    clearance_desired_distance: 0.6
    clearance_cost_weight: 3.0
    replan_on_timer: true
    replan_on_source_update: false
    min_replan_distance: 0.20
    replan_request_topic: /navigation2/replan_request
    # 转向惩罚：turn_cost = turn_penalty * (1 - cos(转向角))。越大路径越直（少
    # 拐弯、少蛇形），但可能绕更远；越小越贴近几何最短但拐角多。
    turn_penalty: 0.12
    # 局部缝合：重规划时在旧路径前方 stitch_min_lookahead_distance 处接新路径，
    # 避免整条路径跳变；缝合段最长 stitch_max_distance。车头路径抖优先看这里。
    local_stitch_enabled: true
    stitch_min_lookahead_distance: 0.8
    stitch_max_distance: 3.0
    path_prune_enabled: false
    prune_segment_max_cost: 55
    path_resample_distance: 0.18
    # 语义地图：隧道格的轴线用来在洞内给「偏离轴线」加代价。收不到这个话题时 A*
    # 退回纯几何行为（隧道被当普通空地），不报错。
    semantic_map_topic: /map_server/semantic_map
    # 洞内偏离轴线的代价权重：每步加 w * (1 - |cos θ|)。洞只比车稍宽，横向余量很小，
    # 斜着走一格就贴壁，所以要把路径压到轴线上。
    #
    # 是软代价而不是硬性禁止斜步：车体是圆柱，朝向不影响能不能过。设 0 关闭。
    tunnel_axis_cost_weight: 2.0

rm_global_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    map_topic: /map
    # 语义地图：隧道本体向外扩 tunnel_margin_m 的影响区内点云一律不标记，膨胀
    # 半径压到通道容得下的值。没收到这个话题时行为退回纯几何，不会报错。
    semantic_map_topic: /map_server/semantic_map
    pointcloud_topic: /segmentation/obstacle
    costmap_topic: /global_costmap/costmap
    raw_costmap_topic: /global_costmap/costmap_raw
    footprint_topic: /global_costmap/published_footprint
    marked_cloud_topic: /global_costmap/voxel_marked_cloud
    voxel_grid_topic: /global_costmap/voxel_grid
    subscribe_pointcloud: true
    publish_frequency: 8.0
    robot_radius: 0.25
    inflation_radius: 0.5
    inflation_cost_scaling_factor: 3.0
    occupied_threshold: 60
    obstacle_min_range: 0.1
    obstacle_max_range: 3.0
    # 障碍高度带，相对机器人底盘（base_link）而不是 map 的 z=0 平面：map 的 z=0
    # 是雷达平面（Super-LIO 的 odom 锚在开机雷达位姿），地面在 -(安装高度) 处，
    # 拿绝对 z 比常数会让 20cm 高台静默消失。语义和取值理由见
    # bringup/config/navigation2.yaml，两份配置必须保持一致。
    obstacle_z_min_to_robo: 0.1
    obstacle_z_max_to_robo: 2.0
    # 隧道影响区边距：本体格向外扩这么多米。区内点云一律不标记 —— 顶板、门楣在
    # 点云里跟墙没有区别，任何高度阈值都在「滤掉结构」和「漏掉真障碍」之间赌；
    # 净高够不够、姿态收没收归电控，导航只负责把车沿轴线送进洞，能不能进由静态
    # 地图的壁面致命格决定。0 边距时门楣点云（落在本体格外一到两格）会被标成致命
    # 格横在洞口上、洞口格又吃到两侧墙的全量膨胀，洞口整体封死。
    # 语义与 rm_local_costmap 的同名参数一致，两边必须一起改。
    tunnel_margin_m: 0.20
    transform_tolerance: 0.2
    observation_timeout: 1.0
    reuse_previous_grid: true
    previous_obstacle_decay: 12

rm_minco_path_smoother:
  ros__parameters:
    use_sim_time: true
    input_path_topic: /plan_raw
    output_path_topic: /plan

    # MINCO 优化参数
    smooth_weight: 0.1        # 平滑项权重（降低以保持原路径形状）
    obstacle_weight: 10.0     # 障碍物惩罚权重
    data_weight: 10.0         # 数据项权重（保持接近原路径）
    robot_radius: 0.25        # 机器人半径（与 global_costmap 保持一致）
    penalty_mu: 0.4           # Smoothed L1 惩罚函数的 μ 参数
    enable_optimization: true # 是否启用优化

    # 语义地图：隧道格的轴线用来在洞内给「偏离轴线」加软代价。收不到这个话题或图里
    # 没隧道时对齐项自动失效，退回纯几何平滑。
    semantic_map_topic: /map_server/semantic_map
    # 隧道内偏离轴线的软代价权重：每段加 w * (1 - |cos θ|)。A* 出的路已经沿轴，这一项
    # 防止平滑阶段在洞口把对着洞的走向拧成斜切。洞只比车稍宽，斜一点就贴壁。
    #
    # 软代价而非硬约束：车是圆柱，朝向不影响能不能过，偏轴只是该少走。设 0 关闭。
    tunnel_axis_weight: 5.0

    # 时间分配参数
    default_velocity: 1.5     # 默认速度（用于计算段时间）
    min_segment_time: 0.1     # 最小段时间（秒）

    # RC-ESDF 参数（车体坐标系下的障碍物距离场）
    esdf_width: 2.0           # ESDF 地图宽度（米）
    esdf_height: 2.0          # ESDF 地图高度（米）
    esdf_resolution: 0.05     # ESDF 分辨率（米）

    # 机器人外形（多边形顶点，单位：米）。
    #
    # 车体是圆柱（半径 0.25，见 bringup/urdf/*.xacro），这里用正八边形逼近 ——
    # RC-ESDF 要的是多边形。顶点在半径 0.27 上、边中点在 0.25，即外接八边形：
    # 宁可略微高估车体，也不要在洞里低估。
    #
    # 别退回成矩形：原来的 [±0.3, ±0.25] 在车头方向多算了 5 cm，而洞只比车稍宽，
    # 这 5 cm 会让 MINCO 以为洞里塞不进去。
    robot_footprint: [
      0.25, 0.104, 0.104, 0.25, -0.104, 0.25, -0.25, 0.104,
      -0.25, -0.104, -0.104, -0.25, 0.104, -0.25, 0.25, -0.104]

rm_local_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    scan_topic: /scan
    pointcloud_topic: /segmentation/obstacle
    # 语义地图：隧道本体向外扩 tunnel_margin_m 的影响区内点云一律不标记，膨胀
    # 半径压到通道容得下的值。没收到这个话题时行为退回纯几何，不会报错。
    semantic_map_topic: /map_server/semantic_map
    costmap_topic: /local_costmap/costmap
    raw_costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    marked_cloud_topic: /local_costmap/voxel_marked_cloud
    subscribe_scan: true
    subscribe_pointcloud: false
    update_frequency: 10.0
    publish_frequency: 10.0
    width: 5.0
    height: 5.0
    resolution: 0.05
    robot_radius: 0.25
    inflation_radius: 0.35
    inflation_cost_scaling_factor: 15.0
    raytrace_max_range: 6.0
    obstacle_min_range: 0.1
    obstacle_max_range: 6.0
    # 同上。局部图管避障，下界取更小的 0.05 以少漏矮障碍，但仍为正值。
    obstacle_z_min_to_robo: 0.05
    obstacle_z_max_to_robo: 2.0
    # 隧道影响区边距，语义见 rm_global_costmap 里的同名参数。两边必须一致：
    # 只在一边放行会让全局规划出的路在局部层被判为撞墙。
    tunnel_margin_m: 0.20
    transform_tolerance: 0.2
    observation_timeout: 2.0
    snap_origin_to_grid: true
    use_observation_stamp_for_origin: true
    publish_on_observation_update: false
    use_latest_sensor_transform: false
    fallback_to_latest_sensor_transform: false
    update_on_new_observation_only: true
    reuse_previous_grid: true
    previous_obstacle_decay: 8

# 到点接近控制器：插在 MPC 与 velocity_smoother 之间，负责「快到目标时的减速与对准」。
# MPC 的输出（/cmd_vel_nav_raw）经过这里再交给 velocity_smoother。三段式：
#   dist >  approach_distance         原样转发 MPC 指令（含朝向）
#   dist <= approach_distance         限速到 approach_velocity，方向不动
#   dist <= direct_approach_distance  P 控制对准目标（速度 = dist * kp，越近越慢）
#   dist <= goal_tolerance            到达，无条件发零 Twist
goal_approach_controller:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    input_cmd_vel_topic: /cmd_vel_nav_raw
    output_cmd_vel_topic: /cmd_vel_nav
    path_topic: /plan
    approach_enabled_topic: /goal_approach_controller/enabled
    # 距离目标多远开始限速（m）。调小=更晚减速、冲得更近；调大=更早收住。
    approach_distance: 1.5
    # 接近段速度上限（m/s）。调小=到点更慢更稳，调大=冲得更快。
    approach_velocity: 0.5
    # 直接对准段半径（m）：小于此值后用 P 控制直接对准目标（角度速度置零）。
    direct_approach_distance: 0.5
    # 对准段 P 增益：目标速度 = dist * kp。越大到点越果断，过大易过冲、摆动。
    direct_approach_kp: 1.0
    # 到达判定半径（m）。必须 <= 上游 MPC 的 goal_tolerance，否则 MPC 还在发速度、
    # 这里已经按住车不动，会到点反复蠕动。注意：本文件 MPC 是 0.2、这里是 0.25，
    # 已违反此约束（死区）；实际生效的 bringup 配置两者都是 0.25 无此问题。
    goal_tolerance: 0.25

# 速度平滑器：对上游指令做限幅 + 平滑，输出最终 /cmd_vel。车「一顿一顿」或
# 「起步/刹车太猛」优先查这里。
rm_velocity_smoother:
  ros__parameters:
    use_sim_time: true
    input_cmd_vel_topic: /cmd_vel_nav
    output_cmd_vel_topic: /cmd_vel
    smoothing_frequency: 20.0   # 平滑器输出频率（Hz）
    velocity_timeout: 0.5       # 输入超时（s）：超过此时长无输入即归零停车
    max_velocity: [2.0, 2.0, 3.0]     # 速度上限 [x, y, yaw]（m/s, rad/s）
    min_velocity: [-2.0, -2.0, -3.0]  # 速度下限（负值 = 允许倒车/反向转）
    max_accel: [4.0, 4.0, 6.0]        # 加速度上限 [x, y, yaw]（m/s², rad/s²）
    max_decel: [-4.0, -4.0, -6.0]     # 减速度上限（负值，越负刹车越急）
    deadband_velocity: [0.0, 0.0, 0.0]  # 死区：绝对值小于此值强制归零（抑制微抖）

rm_nav2_compat:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    action_name: /navigate_to_pose
    goal_topic: /goal_pose
    status_topic: /navigation2/status
    feedback_frequency: 10.0
    action_timeout: 0.0

rm_mpc_controller:
  ros__parameters:
    use_sim_time: true
    target_frame: map
    path_topic: /plan
    odom_topic: /Odometry
    cmd_vel_topic: /cmd_vel_nav_raw
    # 云台收放。rm_tunnel_posture 在进洞前把 posture_topic 置真，serial_driver 把电控
    # 回传的实测姿态发到 posture_state_topic。请求「收下来」而实测还没变成「低」时，本
    # 节点停车等 —— 云台立着进洞会撞在顶板上，停着等的代价只是不动。
    gimbal.posture_topic: /gimbal_posture
    gimbal.posture_state_topic: /gimbal_posture_state
    control_fps: 30.0
    expected_speed: 1.5
    goal_tolerance: 0.2
    # 跟踪残差超过此值判为「跟丢」（触发 tracker 丢失 / 恢复链）。调大=更容忍
    # 路径偏差（不易报丢但可能偏离路线），调小=更严格（频繁报丢）。
    max_track_error: 0.5
    # 终点盲区（m）：路径终点附近此半径内跳过参考点（避免终点数值抖动）。
    blind_radius: 0.1
    # 指令延迟补偿（s）：odom 相对当前时刻的延迟，>0 时外推位姿。默认关。
    delay_time: 0.0
    # 无参考航向时的默认角速度（rad/s）。一般保持 0。
    default_wz: 0.0
    # Prediction horizon (MPC): steps * predict_dt seconds ahead.
    predict_steps: 30
    predict_dt: 0.1
    max_speed: 2.0
    max_accel: 4.0
    turtle_max_speed: 1.0
    # QP 权重：Q=位置跟踪、R=控制量大小、Rd=控制平滑度。
    #   轨迹贴不贴        → 调 Q（大=贴得紧，但易震荡/超调）
    #   速度敢不敢给      → 调 R（大=越省力越保守，速度上不去）
    #   速度/角速度抖不抖 → 调 Rd（大=越平滑，但响应滞后）
    Q: [15.0, 15.0]
    R: [0.1, 0.1]
    Rd: [1.0, 0.05]
    # Odometry delay compensation (off by default; extrapolates pose over odom->now latency).
    delay_compensation.enable: false
    delay_compensation.max_dt: 0.5
    local_safety.costmap_topic: /local_costmap/costmap
    local_safety.obstacle_threshold: 90
    local_safety.unknown_is_obstacle: true
    local_safety.costmap_timeout: 0.5
    # Check 1.0 s ahead; the 5 m rolling map cannot contain the full 3.0 s horizon at max speed.
    local_safety.check_steps: 10
    local_safety.replan_topic: /navigation2/replan_request
    local_safety.replan_cooldown: 0.5
    # 隧道限速窗口。洞内的参考速度按 TunnelSpec 的 [velocity_min, velocity_max] 夹：
    # 洞里净空低、余量小，全速冲进去既危险、参考又不可跟踪。减速斜坡在进洞前就铺开，
    # 不是洞口瞬间跳变。收不到语义地图或图里没隧道时静默失效。设 enable=false 关闭。
    tunnel_speed_window.enable: true
    tunnel_margin_m: 0.20
    semantic_map_topic: /map_server/semantic_map

rm_tunnel_posture:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    semantic_map_topic: /map_server/semantic_map
    # 规划路径（map 系）。判定「是不是真要穿洞」：路径穿过隧道本体才收云台，贴着
    # 洞口路过（不进洞）不收。收不到路径时只靠 inside 兜底。
    path_topic: /plan
    # 发给电控的收云台请求。true = 车即将进洞或正在洞里，云台必须收下来。
    posture_topic: /gimbal_posture
    # 判定频率。提前量是距离量（TunnelSpec.run_up），不是时间量，所以这里不需要跟
    # 控制环同频；10 Hz 下 1.5 m/s 每帧走 0.15 m，相对 run_up 的余量足够。
    update_frequency: 10.0
    # 抬起云台要比落下多退这么多米才算离开隧道影响范围。
    # 没有滞回时，标志位会在 run_up 边界上随定位噪声抖动，电控那边就是云台反复抬落。
    hysteresis: 0.3

rm_gimbal_visualizer:
  ros__parameters:
    use_sim_time: true
    # 画在车体坐标系里，随车走。与 rm_tunnel_posture 用同一个 frame。
    robot_base_frame: base_link_fake
    # 实态 = 电控持续回传（serial_driver 转发电控，仿真里是 simulated_gimbal）。
    posture_state_topic: /gimbal_posture_state
    # 命令 = rm_tunnel_posture 发的切换请求，和实态并排显示，能看出执行延迟。
    posture_topic: /gimbal_posture
    # RViz MarkerArray 显示块订阅这个话题。
    marker_topic: /gimbal_status
