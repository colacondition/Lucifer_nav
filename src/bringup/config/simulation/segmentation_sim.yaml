ground_segmentation:
  ros__parameters:
    n_threads: 2                # OpenMP fork-join; keep sim aligned with real budget.

    r_min: 0.2                  # minimum point distance.
    r_max: 10.0                 # maximum navigation point distance.
    # 实测过 80~300：n_bins 对高台识别没有影响，全部由 max_start_height 决定。
    # 保持 120。（离线实验见下方 max_start_height 的说明。）
    n_bins: 120                 # number of radial bins.
    n_segments: 360             # number of radial segments.

    # 点到地面线的垂直距离小于此值即判为地面(ground_segmentation.cc:178)。
    # 台面正上方根本没有地面线覆盖（verticalDistanceToLine 返回 -1），所以高台
    # 识别与这个值无关；它只决定台阶竖直侧面最下面几厘米算不算地面。
    # 收紧只会把实车地面噪点变成虚假障碍，保持 0.1。
    max_dist_to_line: 0.1       # maximum vertical distance of point to line to be considered ground.

    # 与实车同一套逻辑：节点用 sensor_height_frame -> 点云 frame 的 TF 查出真值
    # 覆盖它（= URDF 外参 0.175，见 config/simulation/measurement_params_sim.yaml），
    # 这里只是 TF 查不到时的兜底。原值 0.275 跟外参差了 0.1，现改成一致。
    sensor_height: 0.175        # fallback only, resolved from TF at runtime.
    sensor_height_frame: "base_link"   # 查 sensor_height 的参考系。空 = 关闭，用上面的值。
    base_to_ground_z: 0.0       # base_link 原点离地高度，底盘几何；0 = 原点贴地。
    # 负值等于关闭该判据：条件是 fabs(slope) < min_slope(segment.cc:56)，恒为假。
    min_slope: -0.4             # minimum slope of a ground line.
    max_slope: 0.4              # maximum slope of a ground line.
    max_fit_error: 0.05         # maximum error of a point during line fit.
    long_threshold: 1.0         # distance between points after which they are considered far from each other.
    max_long_height: 0.1        # maximum height change to previous point in long line.
    # 高台能不能看见，全部卡在这一个值上(segment.cc:76-77)。
    # 台阶处的流程：地面线长到台阶前 -> 加入第一个台面点使拟合误差爆掉 -> 整条线
    # 被拒、只留最后一个点 -> 下一点落到 size<2 的 else 分支，即这里。
    # 判据是 |上一点的 z - 已提交地面线末端高度| < max_start_height：
    #   0.5 > 0.2：台面点被允许当新线起点，两三点就拟合出一条贴着台面的「地面
    #              线」，整片高台判成地面 —— 这就是仿真里看不见 20cm 高台的原因。
    #   0.1 < 0.2：该判据失败，走 clear() 分支，台面上攒不够点、拟合不出线，
    #              verticalDistanceToLine 返回 -1，台面点落进 obstacle。
    # 语义就是「能识别的最小台阶高度」，必须小于 0.2。
    # 已用真实的 GroundSegmentation 链接离线跑过合成场景验证：
    #   start_h=0.5 -> 台面漏检 96.2%；start_h=0.1 -> 0.0%
    #   n_bins 80~300、max_slope 0.15/0.4、max_fit_error 0.02/0.05 均无影响
    #   地面坡度 0/5%/10%/15% 下虚警率均为 0.00%，收紧到 0.1 不会误伤斜坡
    #   可识别下限：10cm 台阶在 0.1 下仍为 0% 漏检，5cm 台阶识别不了
    max_start_height: 0.1       # maximum difference to estimated ground height to start a new line.
    line_search_angle: 0.8      # how far to search in angular direction to find a line [rad].

    # 与实车取一致的 base_link。仿真外参 rpy 全 0，这个旋转是恒等变换、行为不变；
    # 写成一样是为了 real/sim 只有外参数值不同，逻辑完全同一条路径。
    gravity_aligned_frame: "base_link"   # Frame which has its z axis aligned with gravity. (Sensor frame if empty.)

    latch: false                # latch output topics or not
    visualize: false            # visualize segmentation result - USE ONLY FOR DEBUGGING

    input_topic: "/livox/lidar_filtered/pointcloud"
    obstacle_output_topic: "segmentation/obstacle"
    ground_output_topic: "segmentation/ground"
