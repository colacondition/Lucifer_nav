# decision 完整运行参数真源；targets.* 路径由 real.launch.py 按 world/bringup_dir 动态覆盖。
bt_action_replacement:
  ros__parameters:
    loop_hz: 30.0
    retry_interval_sec: 0.2
    # 目标下发超时守卫：超时无任何 action 事件则合成 Aborted 并重发。
    # 必须大于最长合法航点段执行时间；0 关闭。executor 崩溃重生后
    # rclcpp_action 不会有任何回调，这条是「静默挂死」的唯一出口。
    executor_result_timeout_sec: 60.0
    goal_frame_id: "map"
    topics:
      robot_status: "robot_status"
      game_status: "game_status"
      goal: "/goal_pose"
      decision_state: "/decision/state"
      localization_status: "/localization_status"
    integrity_gate:
      enable: true
    waypoint_executor:
      saved_waypoint_file_topic: "/waypoint_editor/saved_waypoint_file"
      executor_waypoints_topic: "/waypoint_editor/executor_waypoints"
      follow_action: "/waypoint_editor/follow_waypoints"
      through_action: "/waypoint_editor/through_waypoints"
      start_delay_sec: 0.0
    game:
      progress: 4
      lower_remain_time: 0
      higher_remain_time: 300
    hp_recovery:
      low_threshold: 120
      high_threshold: 400
    targets:
      patrol_waypoint_file: ""
      center_waypoint_file: ""
      wait_center_waypoint_file: ""
      home_waypoint_file: ""
      wait_home_waypoint_file: ""
      wait_hp_waypoint_file: ""
    waypoint:
      switch_distance: 0.6
      final_goal_tolerance: 0.35
    maintain_goal:
      enable: true
      robot_base_frame: "base_link_fake"
      xy_tolerance: 0.35
      drift_hold_sec: 0.8
    combat:
      enable: true
      firing_heat_threshold: 1
      engage_hold_sec: 0.4
      reposition_hold_sec: 0.5
      reposition_path_len: 3
      reposition_grace_sec: 3.0
