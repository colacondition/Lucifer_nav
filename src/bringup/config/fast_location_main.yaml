/**:
  ros__parameters:
    # ========== 地图与定位参数 ==========
    map_pcd_path: "package://bringup/PCD/RMUL.pcd"
    map_voxel_size: 0.1          # 地图体素滤波尺寸（米）
    scan_voxel_size: 0.05        # 扫描体素滤波尺寸（米）- 降低以保留更多点
    scan_input_frame_mode: "odom" # 源点云坐标系: odom/base
    scan_accumulate_frames: 5     # 源点云坐标系下堆积帧数
    scan_min_range: 0.0           # 源点云最小距离过滤（米）
    scan_max_range: 0.0           # 源点云最大距离过滤（米，<=0关闭）
    submap_voxel_size_first: 0.1 # 首次定位子图体素尺寸（米，建议=map_voxel_size）
    submap_voxel_size_track: 0.15 # 跟踪子图体素尺寸（米，建议>map_voxel_size）
    fov_far: 20.0                # 视场内最远距离（米）
    localization_th: 0.90        # 定位匹配阈值（内点比例）
    first_localization_th: 0.95  # 首次匹配阈值（内点比例）
    # 可观测性阈值：GICP 平移信息矩阵 XY 子块的 λ_max/λ_min 超过此值时，判定
    # 存在方向退化（典型是长走廊：沿走廊方向没有匹配约束）。
    #
    # 命中后**不丢弃整拍结果**，而是把修正投影到可观测方向：垂直走廊的那一维
    # 照常修正，沿走廊方向交回 LIO 推算。fast_location 是本工作空间唯一的
    # map→odom 来源，整拍拒绝会让 TF 冻结，精度完全交给 LIO 开环漂移。
    #
    # 开阔区域条件数约 1~5，走廊可达数百。80 是留了余量的保守取值。
    degenerate_condition_threshold: 80.0
    # 硬拒绝阈值：条件数超过此值说明连 yaw 都不可信（近乎完全无约束），
    # 此时才整拍放弃、沿用上一次的 map→odom。必须 >= 上面的软阈值。
    degenerate_hard_reject_condition: 5000.0
    # ========== 定位稳定性调参（抖 / 漂 / 跳）==========
    # map→odom 的理想值几乎恒定（odom 是 LIO 里程计原点，车动时原点不动），
    # 它只该随「LIO 慢漂被纠正」和「出洞/粗→细校正」而变。ICP 每拍有匹配噪声，
    # 下面几个参数共同决定噪声和漂移怎么进入 map→odom：
    #
    #   ema_alpha       正常拍平滑系数    —— 低=强平滑=压抖动，但漂移收敛慢
    #   recovery_alpha  校正/出洞拍收敛   —— 高=漂移一次收回，但校正量大时会"跳"
    #   coarse_every    粗→细校正周期     —— 小=漂移压得勤，但校正拍多了接近抖动
    #
    # 现象 → 调法：
    #   map→odom 一直轻微抖        → 调小 ema_alpha（0.3 → 0.2）
    #   缓慢漂移（走一会儿位置偏）  → 调小 coarse_every（12 → 6）或调大 recovery_alpha
    #   偶发跳一下（校正/出洞猛收） → 调小 recovery_alpha（0.85 → 0.7）或调大 coarse_every
    #
    # EMA 平滑系数 α：每次接受新结果时 T_smooth = α*T_new + (1-α)*T_prev。
    # 值越低正常拍越稳（更少吸收 ICP 单拍噪声），但真实漂移的收敛也越慢。
    # 0.25 时 RViz 里整车仍会跟着 10Hz ICP 微抖；压到 0.15 把单拍噪声再隔一层。
    ema_alpha: 0.15
    # 出洞/粗→细校正拍的临时 EMA 系数：接近 1 时一拍吸收绝大部分修正（避免数秒
    # 爬行），又保留少量平滑防止单拍噪声完全外露成抖动。
    # 粗尺度逃逸每 coarse_every 拍也走这个 α；0.95 会把单次粗尺度跳变几乎原样送进 map→odom，
    # RViz 里就是整车隔半秒跳一下。
    recovery_alpha: 0.85
    # 出洞迟滞：连续多少拍退化才认定"在洞里"，之后退化→正常才触发快速收敛。
    # 单拍条件数在阈值附近抖动不会误触发。越大越不易误触发，但出洞响应越慢。
    degenerate_enter_streak: 3
    # 粗→细校正周期：每多少拍穿插一次粗尺度 ICP 跳出局部最优（打破累积漂移），
    # 其余拍用单尺度保持逐拍稳定。越小校正越勤、漂移越小，但越接近抖动。
    # 10Hz 下 coarse_every=5 等于每 0.5s 一次近乎全量校正，RViz 里整车会周期性跳。
    coarse_every: 12

    # ========== 话题配置 ==========
    sub_scan_topic: "/Laser_map_dense"          # 订阅点云话题（small_glim 的定位稠密点云，更细下采样）
    sub_odom_topic: "/lio/robo/odom"            # 订阅里程计话题
    sub_init_pose_topic: "initialpose_3d"      # PoseStamped初始位姿话题
    sub_init_pose_covariance_topic: "/initialpose"  # RViz 2D Pose Estimate 初始位姿

    pub_pc_in_map_topic: "pc_in_map"           # 发布：匹配后的点云
    pub_global_map_topic: "global_map"         # 发布：全局地图
    pub_submap_topic: "submap"                 # 发布：局部子图
    pub_map_to_odometry_topic: "map_to_odometry"  # 发布：map->odom变换
    pub_scan_downsampled_topic: "scan_downsampled"  # 发布：下采样扫描
    pub_map_downsampled_topic: "map_downsampled"    # 发布：下采样地图

    # ========== 频率与队列 ==========
    io_queue_size: 10            # 发布/订阅队列长度
    map_publish_rate_hz: 5.0     # 全局地图发布频率（Hz）
    localization_rate_hz: 10.0   # 定位更新频率（Hz）
    tf_publish_rate_hz: 50.0    # map->odom TF 发布频率（tf2 自行插值，50Hz 足够）
    publish_tf: true             # 主定位模式：发布 map->odom TF
    publish_map_to_odometry: false  # 是否发布 map_to_odometry 里程计话题

    # ========== ICP 参数 ==========
    gicp_num_threads: 2              # 8-core budget; real launch already pins 2
    gicp_max_iterations_first: 100   # 首次定位 GICP 最大迭代次数
    gicp_max_iterations_track: 70   # 跟踪阶段 GICP 最大迭代次数

    # ========== 全局重定位参数 ==========
    # 出生点固定，不需要全场搜索。全场搜索是纯暴力撒点 + 最近邻命中率打分、
    # 没有任何出生先验，在对称场地（RMUL 两角几何相似）会以一定概率误锁到对角。
    #
    # 关掉后，出生定位走 globalLocalization(initial_pcd_to_odom)：初始猜测是
    # 单位阵 = PCD 原点 = 出生点。成立的前提是 small_glim 的 world 原点锚在
    # 开机雷达平面，且建图（mapping）和小跑（nav）都从同一个固定出生点起，
    # 于是 PCD 原点就是出生点。多尺度 ICP 从出生点局部收敛，对角的候选离得
    # 很远、根本不会被评估到，也就不会跳对角。
    #
    # 代价：跟踪丢失后 handleTrackingFailure 把 initialized 置回 false，下一拍
    # 不再全场重定位，而是从出生点（单位阵）重新做局部 ICP —— 车离出生点远时
    # 可能收不回来。要恢复「被抱走后全场重定位」，再把这个开关打开。
    enable_global_search: false
    global_search_xy_step: 2.0
    global_search_max_candidates: 2000000  # 候选硬上限：飞点/大图时自动加大步长防止 OOM
    global_search_yaw_step_deg: 30.0
    global_search_score_distance: 0.45
    global_search_score_stride: 4
    global_search_top_k: 6
    global_search_min_score: 0.20
    global_search_min_score_margin: 0.03
    global_search_candidate_separation: 1.0
    global_search_candidate_yaw_separation_deg: 20.0
    global_search_refine_radius: 12.0
    # top-k 精细打分:只作用在入选候选(~6个)上,stride=1、距离更严。
    global_search_refine_score_distance: 0.20
    global_search_refine_score_stride: 1
    # 精化 ICP 阶段用最近 N 帧堆积起来,提高稳定性;粗搜仍用主 scan。
    global_search_refine_accumulate_frames: 3
    # 全局搜索通过后,再用下一帧扫描做一致性校验才真正接受。对称场地建议打开。
    global_search_enable_temporal_verification: false
    global_search_temporal_min_score: 0.30
    tracking_failures_before_global_search: 5

    # ========== 坐标系配置 ==========
    map_frame: "map"             # 地图坐标系（TF父）
    base_frame: "odom"           # fast_location发布的TF子frame (map→odom)
    pc_in_map_frame: "map"       # pc_in_map统一发布到map；其他值会回退为map_frame
    map_z_offset: 0.0            # Z轴偏移补偿（仿真地面厚度，实车为0）
    # pcd_to_map_pose 可由 launch 显式传入 [x, y, yaw]；未传入时使用单位对齐，不读取 map_start_pose
